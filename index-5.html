<div class="timer-label">PAYMENT TIME LEFT</div><div class="timer" id="timer">05:00</div><div class="track"><div class="bar" id="bar"></div></div>
<div class="status" id="status" role="status">Payment pending · डेमो टाइमर चल रहा है।</div>
<label for="utr">UTR / Transaction ID</label><input id="utr" type="text" maxlength="50" placeholder="अपना UTR यहाँ डालें" autocomplete="off">
<button id="submitUtr">SUBMIT UTR ON WHATSAPP</button>
<button class="secondary" id="restart">Restart 5-minute timer</button>
<p class="note">QR में राशि पहले से तय नहीं है तो भुगतान करने से पहले राशि जाँच लें। UTR सबमिट करना पेमेंट की पुष्टि नहीं है।</p><footer>HAMper</footer>
</main><script>
const TOTAL=300;
// अपना WhatsApp नंबर country code सहित डालें, + चिन्ह के बिना. उदाहरण: 919876543210
const WHATSAPP_NUMBER = "917740907495";
let deadline=Date.now()+TOTAL*1000,interval;
const amount=document.getElementById('amount'),shown=document.getElementById('shownAmount'),timer=document.getElementById('timer'),bar=document.getElementById('bar'),status=document.getElementById('status');
function amountUpdate(){const n=Number(amount.value);shown.textContent='₹'+(Number.isFinite(n)&&n>0?n.toLocaleString('en-IN',{maximumFractionDigits:2}):'—')}amount.addEventListener('input',amountUpdate);
function tick(){const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));timer.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');bar.style.width=(left/TOTAL*100)+'%';if(left===0){clearInterval(interval);status.textContent='समय समाप्त।';status.style.background='#fff0f0'}}
function restart(){clearInterval(interval);deadline=Date.now()+TOTAL*1000;status.textContent='UTR सबमिट करने के लिए तैयार।';status.style.background='#f3f4f8';tick();interval=setInterval(tick,250)}
document.getElementById('submitUtr').addEventListener('click',()=>{
  const utr=document.getElementById('utr').value.trim();
  const n=Number(amount.value);
  if(!utr){alert('भाई, पहले UTR / Transaction ID डालो।');return;}
  if(!(n>0)){alert('कृपया सही पेमेंट राशि डालें।');return;}
  const msg='You have successfully submitted your UTR.\n\nHAMper Details\nAmount: ₹'+n.toFixed(2)+'\nUTR / Transaction ID: '+utr+'\nStatus: Submitted for verification.';
  const number=WHATSAPP_NUMBER.replace(/\D/g,'');
  const url=number && !number.includes('X') ? 'https://wa.me/'+number+'?text='+encodeURIComponent(msg) : 'https://wa.me/?text='+encodeURIComponent(msg);
  window.open(url,'_blank','noopener,noreferrer');
});
document.getElementById('restart').addEventListener('click',restart);amountUpdate();restart();
</script></body></html>
